<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Enterprise Knowledge Assistant</title>

    <link rel="stylesheet"
          href="style.css">

</head>

<body>

<div class="app">

    <header class="app-header">

        <div class="avatar avatar-assistant">
            🤖
        </div>

        <div>

            <h1>Enterprise Knowledge Assistant</h1>

            <div class="status">

                <div class="status-dot"></div>

                Connected to Local AI

            </div>

        </div>

    </header>

    <main
        id="chat"
        class="chat">

    </main>

    <footer class="input-bar">

        <input
            id="question"
            type="text"
            placeholder="Ask something about your company..."
        >

        <button id="askButton">

            ➤

        </button>

    </footer>

</div>

<script src="script.js"></script>

</body>

</html>
